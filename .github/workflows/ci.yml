name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Check-only lint (no --fix) so the gate fails on any violation,
      # including autofixable ones, instead of silently rewriting files.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # Runs only the in-process unit tests under `src/` (jest's testRegex is
      # `.*\.spec\.ts$` rooted at `src`). The e2e suite is intentionally
      # excluded — `test/codex-cli.provider.e2e-spec.ts` shells out to the
      # `codex` binary and (optionally) hits the OpenAI API, neither of which
      # are available on a clean CI runner.
      - name: Unit tests
        run: npm test

  web:
    name: Web (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Check-only lint (no --fix) so the gate fails on any violation,
      # including autofixable ones, instead of silently rewriting files.
      - name: Lint
        run: npm run lint:ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
