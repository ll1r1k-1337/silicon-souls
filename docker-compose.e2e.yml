services:
  postgres:
    container_name: sdd-stage0-e2e-postgres
    environment:
      POSTGRES_DB: sdd_stage0_e2e
    ports: !override []
    volumes: !override
      - sdd_stage0_e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdd_stage0_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  api:
    container_name: sdd-stage0-e2e-api
    environment:
      API_PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sdd_stage0_e2e
      WEB_ORIGIN: http://web:5173
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${BASE_URL:?BASE_URL is required}
      OPENAI_API_KEY: ${API_KEY:?API_KEY is required}
      LLM_MODEL: ${MODEL_ID:?MODEL_ID is required}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
    ports: !override []
    restart: "no"

  worker:
    container_name: sdd-stage0-e2e-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sdd_stage0_e2e
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${BASE_URL:?BASE_URL is required}
      OPENAI_API_KEY: ${API_KEY:?API_KEY is required}
      LLM_MODEL: ${MODEL_ID:?MODEL_ID is required}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
    restart: "no"

  web:
    container_name: sdd-stage0-e2e-web
    environment:
      WEB_PORT: 5173
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
    ports: !override []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  e2e:
    build:
      context: .
      dockerfile: Dockerfile
      target: e2e
    container_name: sdd-stage0-e2e-runner
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://web:5173
      MODEL_ID: ${MODEL_ID:?MODEL_ID is required}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      worker:
        condition: service_started
    restart: "no"

volumes:
  sdd_stage0_e2e_pgdata:
