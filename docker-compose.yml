services:
  postgres:
    image: postgres:16-alpine
    container_name: silsol-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: silsol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    image: node:22-alpine
    container_name: silsol-server
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/silsol
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - postgres

  web:
    image: node:22-alpine
    container_name: silsol-web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server

volumes:
  pgdata:
