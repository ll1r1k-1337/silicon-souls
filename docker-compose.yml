services:
  postgres:
    image: postgres:16-alpine
    container_name: sdd-stage0-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sdd_stage0
    ports:
      - "5432:5432"
    volumes:
      - sdd_stage0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdd_stage0"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: sdd-stage0-api
    environment:
      API_PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sdd_stage0
      WEB_ORIGIN: http://localhost:5173
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-5.2
      LLM_TEMPERATURE: 0.2
      LLM_MAX_RETRIES: 2
      LLM_TIMEOUT_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: sdd-stage0-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sdd_stage0
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-5.2
      LLM_TEMPERATURE: 0.2
      LLM_MAX_RETRIES: 2
      LLM_TIMEOUT_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: sdd-stage0-web
    environment:
      WEB_PORT: 5173
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  sdd_stage0_pgdata:
