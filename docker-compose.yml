services:
  postgres:
    image: postgres:16-alpine
    container_name: silsol-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: silsol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d silsol"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    image: node:22-alpine
    container_name: silsol-server
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/silsol
    command: sh -c "npm ci && npm run db:migrate && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: silsol-web
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  pgdata:
  server_node_modules:
  web_node_modules:
